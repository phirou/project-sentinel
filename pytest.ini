[pytest]
# Configuration globale de pytest pour Sentinel.

# Où chercher les tests.
testpaths = tests

# Pattern de fichiers et fonctions de test.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mode async pour les tests asyncio.
asyncio_mode = auto

# Options par défaut au lancement de pytest.
addopts =
    --strict-markers
    --strict-config
    -v
    --tb=short

# Markers personnalisés (utilisés pour catégoriser les tests).
markers =
    slow: tests qui prennent plus de 100ms à s'exécuter
    integration: tests d'intégration qui touchent à plusieurs modules
    hardware: tests qui nécessitent du hardware réel (à skipper en CI)