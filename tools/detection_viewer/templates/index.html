<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL // Detection Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' fill='none' stroke='%2300ff41' stroke-width='2'/><circle cx='8' cy='8' r='3' fill='%2300ff41'/></svg>">
<style>
/* ============================================================
   Detection Viewer — feuille de style (aucun framework CSS)
   Thème « tactique sobre » : fond quasi noir, vert phosphore.
   ============================================================ */
:root {
  --fond: #0a0e0a;          /* fond général */
  --panneau: #0c110c;       /* fond des panneaux */
  --bordure: #1d2b1d;       /* traits et séparations */
  --vert: #00ff41;          /* accent principal (phosphore) */
  --orange: #ff9500;        /* classes autres que "person" */
  --texte: #c2d6c2;         /* texte courant */
  --texte-2: #5f7a5f;       /* texte secondaire */
  --police: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--fond);
  color: var(--texte);
  font-family: var(--police);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------------- Barre du haut ---------------- */
header {
  display: flex;
  align-items: center;
  gap: 24px;
  height: 52px;
  flex: none;
  padding: 0 16px;
  background: var(--panneau);
  border-bottom: 1px solid var(--bordure);
}

.titre {
  color: var(--vert);
  font-weight: 700;
  letter-spacing: 2px;
  white-space: nowrap;
}
.titre span { color: var(--texte-2); font-weight: 400; }

/* Sélecteur de modèle : l'état « actif » reflète le backend (via /stats),
   l'état « attente » clignote pendant le chargement d'un modèle. */
.selecteur { display: flex; gap: 6px; }
.selecteur button {
  font: inherit;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--texte-2);
  background: transparent;
  border: 1px solid var(--bordure);
  padding: 6px 12px;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.selecteur button:hover { color: var(--vert); border-color: var(--vert); }
.selecteur button.actif {
  color: var(--fond);
  background: var(--vert);
  border-color: var(--vert);
  font-weight: 700;
}
.selecteur button.attente {
  color: var(--vert);
  border-color: var(--vert);
  animation: clignote .8s steps(2, start) infinite;
}

/* Sélecteur de source vidéo : même langage visuel que les boutons de modèle.
   L'apparence native du <select> est neutralisée, la flèche est redessinée. */
.source-enrobage { position: relative; }
.source-enrobage::after {
  content: "▾";
  position: absolute;
  right: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--vert);
  font-size: 10px;
  pointer-events: none;
}
#selecteur-source {
  font: inherit;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--vert);
  background: transparent;
  border: 1px solid var(--bordure);
  padding: 6px 26px 6px 12px;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  max-width: 230px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  transition: border-color .15s;
}
#selecteur-source:hover, #selecteur-source:focus { border-color: var(--vert); outline: none; }
#selecteur-source.attente { border-color: var(--vert); animation: clignote .8s steps(2, start) infinite; }
#selecteur-source option { background: var(--panneau); color: var(--texte); text-transform: none; }

/* Statistiques (FPS, device, objets) + témoin LIVE, alignés à droite. */
.infos {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 18px;
  color: var(--texte-2);
  font-size: 11px;
  letter-spacing: 1px;
}
.infos b {
  color: var(--vert);
  font-size: 14px;
  margin-left: 6px;
  text-shadow: 0 0 8px rgba(0, 255, 65, .4);
}
.live { display: flex; align-items: center; gap: 7px; color: var(--vert); }
.point {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--vert);
  box-shadow: 0 0 8px var(--vert);
  animation: pulse 1.6s ease-in-out infinite;
}

/* Compteur d'objets uniques (tracking) : liste "12 person, 3 car" tronquée
   si trop longue (le survol via l'attribut title montre le détail complet). */
#uniques {
  max-width: 220px;
  display: inline-block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  vertical-align: bottom;
  font-size: 12px;
}
#uniques.off { color: var(--texte-2); text-shadow: none; }  /* tracking désactivé */

/* Bouton « Reset » : accent orange au survol, pour le distinguer du toggle. */
#btn-reset:hover { color: var(--orange); border-color: var(--orange); }

/* ---------------- Disposition principale ---------------- */
main {
  flex: 1;
  min-height: 0;               /* indispensable pour que la galerie scrolle */
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 12px;
  padding: 12px;
}

.panneau {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panneau);
  border: 1px solid var(--bordure);
}

.entete-panneau {
  display: flex;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--bordure);
  color: var(--texte-2);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.entete-panneau b { color: var(--vert); font-weight: 400; text-transform: none; }

/* ---------------- Flux vidéo ---------------- */
.cadre-video { flex: 1; min-height: 0; display: flex; background: #000; }
.cadre-video img {
  width: 100%;
  height: 100%;
  object-fit: contain;         /* la vidéo garde ses proportions */
  display: block;
}

/* ---------------- Galerie des détections ---------------- */
.galerie {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.galerie::-webkit-scrollbar { width: 8px; }
.galerie::-webkit-scrollbar-thumb { background: var(--bordure); }
.galerie::-webkit-scrollbar-track { background: transparent; }

.vide {
  padding: 24px 0;
  text-align: center;
  color: var(--texte-2);
  font-size: 11px;
  letter-spacing: 1px;
  animation: clignote 1.5s steps(2, start) infinite;
}

.carte {
  display: flex;
  gap: 10px;
  padding: 8px;
  border: 1px solid var(--bordure);
  background: rgba(0, 255, 65, .02);
  animation: apparition .25s ease-out;
}
.carte img {
  flex: none;
  width: 64px; height: 64px;
  object-fit: cover;
  border: 1px solid var(--bordure);
  background: #000;
}
.meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.classe {
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.carte.personne .classe { color: var(--vert); }
.carte.autre .classe { color: var(--orange); }
.confiance { font-size: 11px; }
.barre-conf { height: 3px; background: var(--bordure); }
.barre-conf div { height: 100%; }
.carte.personne .barre-conf div { background: var(--vert); }
.carte.autre .barre-conf div { background: var(--orange); }
.heure { font-size: 10px; color: var(--texte-2); }

/* ---------------- Animations ---------------- */
@keyframes pulse { 50% { opacity: .25; } }
@keyframes clignote { to { opacity: .35; } }
@keyframes apparition { from { opacity: 0; transform: translateY(-4px); } }

/* ---------------- Petits écrans : galerie sous la vidéo ---------------- */
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 260px; }
  .infos { gap: 10px; }
  #selecteur-source { max-width: 140px; }
}
</style>
</head>
<body>

<header>
  <div class="titre">◤ SENTINEL <span>// DETECTION VIEWER</span></div>

  <!-- Sélecteur de modèle : data-modele = nom attendu par POST /set_model -->
  <nav class="selecteur" id="selecteur-modele" aria-label="Choix du modèle">
    <button data-modele="yolov8n">YOLOv8n</button>
    <button data-modele="yolov8s">YOLOv8s</button>
    <button data-modele="yolo11n">YOLO11n</button>
  </nav>

  <!-- Sélecteur de source vidéo : options alimentées par GET /sources -->
  <div class="source-enrobage">
    <select id="selecteur-source" aria-label="Choix de la source vidéo"></select>
  </div>

  <!-- Tracking : toggle « détection simple ↔ tracking » + remise à zéro -->
  <nav class="selecteur" aria-label="Contrôles de tracking">
    <button id="btn-tracking" title="Activer / désactiver le tracking multi-objets">TRACK</button>
    <button id="btn-reset" title="Remettre à zéro les compteurs d'objets uniques">RESET</button>
  </nav>

  <div class="infos">
    <span>FPS<b id="fps">--</b></span>
    <span>DEVICE<b id="device">--</b></span>
    <span>OBJETS<b id="objets">--</b></span>
    <span title="Objets uniques cumulés depuis le dernier reset (tracking)">UNIQUE<b id="uniques">—</b></span>
    <span class="live"><span class="point"></span>LIVE</span>
  </div>
</header>

<main>
  <!-- Flux vidéo annoté (MJPEG servi par le backend) -->
  <section class="panneau">
    <div class="entete-panneau"><span>Flux vidéo</span><b id="source">—</b></div>
    <div class="cadre-video"><img id="flux" alt="Flux vidéo annoté"></div>
  </section>

  <!-- Galerie des dernières détections (vignettes) -->
  <aside class="panneau">
    <div class="entete-panneau"><span>Détections</span><b id="compteur">0</b></div>
    <div class="galerie" id="galerie">
      <div class="vide" id="etat-vide">EN ATTENTE DE DÉTECTIONS…</div>
    </div>
  </aside>
</main>

<script>
/* ============================================================
   Detection Viewer — logique front (vanilla JS, aucun framework)
   ============================================================
   Page 100 % autonome : elle ne dépend du backend qu'à travers
   ses endpoints (/video_feed, /stats, /detections, /sources,
   /set_model, /set_source, /set_tracking, /reset_counts).
   Pour l'héberger sur un autre site, il suffit de renseigner
   API_BASE ci-dessous (le backend autorise le CORS).
*/
const API_BASE = ""; // ex. "http://192.168.1.50:8100" si la page est servie ailleurs

const MAX_VIGNETTES = 20;            // doit correspondre au backend
const PERIODE_STATS_MS = 1000;       // rafraîchissement FPS / modèle
const PERIODE_DETECTIONS_MS = 1000;  // rafraîchissement de la galerie

const $ = (id) => document.getElementById(id);
const flux = $("flux");
const galerie = $("galerie");
const selecteurSource = $("selecteur-source");

let dernierIdVu = 0;      // id de la vignette la plus récente déjà affichée
let libellesSources = {}; // id de source → libellé lisible (rempli par /sources)
let modeTracking = true;  // état courant du tracking (synchronisé via /stats)

/* ---------------- Flux vidéo (MJPEG via une simple balise <img>) -------- */
function demarrerFlux() {
  flux.src = API_BASE + "/video_feed";
  // Si le serveur redémarre, on retente la connexion après 3 s.
  flux.onerror = () => setTimeout(() => {
    flux.src = API_BASE + "/video_feed?retry=" + Date.now();
  }, 3000);
}

/* ---------------- Barre du haut : stats + sélecteurs --------------------- */
async function majStats() {
  try {
    const reponse = await fetch(API_BASE + "/stats");
    const stats = await reponse.json();
    $("fps").textContent = Number(stats.fps).toFixed(1);
    $("device").textContent = String(stats.device).toUpperCase();
    $("objets").textContent = stats.objets;
    $("source").textContent = libellesSources[stats.source] || stats.source;
    // Les boutons reflètent l'état réel du backend, pas un état local :
    // « actif » = modèle en service, « attente » = chargement en cours.
    document.querySelectorAll("#selecteur-modele button").forEach((bouton) => {
      bouton.classList.toggle("actif", bouton.dataset.modele === stats.modele);
      bouton.classList.toggle("attente", bouton.dataset.modele === stats.modele_en_chargement);
    });
    // Même principe pour la source : le menu suit l'état du backend (sauf
    // pendant que l'utilisateur manipule le menu lui-même).
    if (document.activeElement !== selecteurSource) selecteurSource.value = stats.source;
    selecteurSource.classList.toggle("attente", Boolean(stats.source_en_chargement));

    // Tracking : état du toggle + compteurs d'objets uniques par classe.
    modeTracking = Boolean(stats.mode_tracking);
    $("btn-tracking").classList.toggle("actif", modeTracking);
    const bloc = $("uniques");
    const entrees = Object.entries(stats.uniques || {});
    if (!modeTracking) {
      bloc.textContent = "off";          // mode détection simple : pas de comptage d'IDs
      bloc.classList.add("off");
    } else {
      bloc.classList.remove("off");
      // Format demandé : "12 person, 3 car" (le plus fréquent d'abord).
      bloc.textContent = entrees.length
        ? entrees.map(([classe, n]) => `${n} ${classe}`).join(", ")
        : "0";
    }
  } catch { /* serveur momentanément injoignable : on réessaiera */ }
}

async function changerModele(nom) {
  try {
    await fetch(API_BASE + "/set_model", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: nom }),
    });
    majStats(); // retour visuel immédiat (état « attente » sur le bouton)
  } catch (erreur) {
    console.warn("Changement de modèle impossible :", erreur);
  }
}

/* ---------------- Sources vidéo (liste + bascule à chaud) ---------------- */
async function chargerSources() {
  try {
    const reponse = await fetch(API_BASE + "/sources");
    const donnees = await reponse.json();
    libellesSources = {};
    selecteurSource.replaceChildren();
    for (const source of donnees.sources) {
      libellesSources[source.id] = source.libelle;
      const option = document.createElement("option");
      option.value = source.id;
      option.textContent = source.libelle;
      selecteurSource.appendChild(option);
    }
    selecteurSource.value = donnees.source_actuelle;
  } catch {
    setTimeout(chargerSources, 3000); // serveur injoignable : nouvel essai dans 3 s
  }
}

async function changerSource(id) {
  try {
    await fetch(API_BASE + "/set_source", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: id }),
    });
    majStats(); // retour visuel immédiat (le menu clignote pendant la bascule)
  } catch (erreur) {
    console.warn("Changement de source impossible :", erreur);
  }
}

/* ---------------- Tracking (toggle + reset des compteurs) --------------- */
async function basculerTracking() {
  try {
    await fetch(API_BASE + "/set_tracking", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled: !modeTracking }),
    });
    majStats(); // reflète immédiatement le nouvel état du toggle
  } catch (erreur) {
    console.warn("Bascule du tracking impossible :", erreur);
  }
}

async function resetCompteurs() {
  try {
    await fetch(API_BASE + "/reset_counts", { method: "POST" });
    majStats();
  } catch (erreur) {
    console.warn("Reset des compteurs impossible :", erreur);
  }
}

/* ---------------- Galerie des détections -------------------------------- */
function creerCarte(det) {
  // Construction en DOM pur (pas d'innerHTML) : sûr et lisible.
  const carte = document.createElement("article");
  carte.className = "carte " + (det.classe === "person" ? "personne" : "autre");

  const img = document.createElement("img");
  img.src = "data:image/jpeg;base64," + det.image;
  img.alt = det.classe;

  const meta = document.createElement("div");
  meta.className = "meta";

  const classe = document.createElement("span");
  classe.className =   "classe";
  classe.textContent = det.classe.toUpperCase();

  const pourcentage = Math.round(det.confiance * 100);

  const confiance = document.createElement("span");
  confiance.className = "confiance";
  confiance.textContent = pourcentage + " %";

  const barre = document.createElement("div");
  barre.className = "barre-conf";
  const remplissage = document.createElement("div");
  remplissage.style.width = pourcentage + "%";
  barre.appendChild(remplissage);

  const heure = document.createElement("span");
  heure.className = "heure";
  heure.textContent = det.timestamp;

  meta.append(classe, confiance, barre, heure);
  carte.append(img, meta);
  return carte;
}

async function majDetections() {
  try {
    const reponse = await fetch(API_BASE + "/detections");
    const { detections } = await reponse.json();
    $("compteur").textContent = detections.length;

    // Le backend renvoie les plus récentes en premier : on ne garde que les
    // nouvelles (id croissant) et on les insère en haut, dans le bon ordre.
    const nouvelles = detections.filter((d) => d.id > dernierIdVu);
    if (!nouvelles.length) return;
    dernierIdVu = nouvelles[0].id;

    const vide = $("etat-vide");
    if (vide) vide.remove();

    for (const det of nouvelles.reverse()) galerie.prepend(creerCarte(det));

    // On garde au plus MAX_VIGNETTES cartes, comme le backend.
    while (galerie.children.length > MAX_VIGNETTES) galerie.lastElementChild.remove();
  } catch { /* erreur réseau passagère : silencieuse */ }
}

/* ---------------- Initialisation ---------------------------------------- */
document.querySelectorAll("#selecteur-modele button").forEach((bouton) => {
  bouton.addEventListener("click", () => changerModele(bouton.dataset.modele));
});
selecteurSource.addEventListener("change", () => changerSource(selecteurSource.value));
$("btn-tracking").addEventListener("click", basculerTracking);
$("btn-reset").addEventListener("click", resetCompteurs);

demarrerFlux();
chargerSources();
majStats();
majDetections();
setInterval(majStats, PERIODE_STATS_MS);
setInterval(majDetections, PERIODE_DETECTIONS_MS);
</script>

</body>
</html>
